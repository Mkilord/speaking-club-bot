name: speaking-club-bot

x-rabbit-env: &rabbit-env
  RABBIT_HOST: rabbitmq
  RABBIT_PORT: 5672
  RABBIT_USERNAME: ${RABBIT_USERNAME:-bot}
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:?set RABBIT_PASSWORD in .env}

x-node-env: &node-env
  <<: *rabbit-env
  POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-speaking_club}
  POSTGRES_USER: ${POSTGRES_USER:-bot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  MODERATOR_IDS: ${MODERATOR_IDS:-}
  BOT_TIME_ZONE: ${BOT_TIME_ZONE:-Europe/Moscow}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speaking_club}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME:-bot}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?set RABBIT_PASSWORD in .env}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Applies database migrations once and exits, so node replicas do not race for the schema.
  migrate:
    build:
      context: .
      target: node
    environment:
      <<: *node-env
      APP_MIGRATE_ONLY: "true"
      NODE_LISTEN: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  node:
    build:
      context: .
      target: node
    environment: *node-env
    deploy:
      replicas: ${NODE_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      target: dispatcher
    environment:
      <<: *rabbit-env
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BOT_USERNAME: ${BOT_USERNAME:?set BOT_USERNAME in .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
